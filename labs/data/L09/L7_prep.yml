switch_templates:
  - name: Durham Switches
    networks:
      CLIENT_VLAN:
        vlan_id: "{{CLIENT_VLAN}}"
      UPLINK_VLAN_1:
        vlan_id: "{{UPLINK_VLAN_1}}"
      UPLINK_VLAN_2:
        vlan_id: "{{UPLINK_VLAN_2}}"
    port_usages:
      lab_uplink:
        mode: trunk
        port_network: default
        networks:
          - CLIENT_VLAN
          - UPLINK_VLAN_1
          - UPLINK_VLAN_2
        stp_edge: False
      wifi_hosts:
        mode: access
        port_network: UPLINK_VLAN_2
        stp_edge: True
      lab_ap:
        mode: access
        port_network: UPLINK_VLAN_1
        stp_edge: True
      desktops:
        mode: trunk
        port_network: default
        networks:
          - CLIENT_VLAN
          - UPLINK_VLAN_1
          - UPLINK_VLAN_2
        stp_edge: True
    switch_matching:
      enable: True
      rules:
        - name: ex-1
          port_config:
            ge-0/0/0:
              usage: wifi_hosts
            ge-0/0/1:
              usage: lab_ap
            ge-0/0/22:
              usage: desktops
            ge-0/0/23:
              usage: lab_uplink
          match_name[0:4]: EX-1
    extra_routes:
      0.0.0.0/0:
        via: "{{GW}}"
        discard: False
    switch_mgmt:
      root_password: "{{ROOT_PW}}"
    dns_servers:
      - 8.8.8.8
    sites:
      - Durham
applications:
  - name: Internet
    type: custom
    addresses:
      - 0.0.0.0/0
