  - name: SQL
    type: custom
    addresses:
      - 10.66.66.132/32
    specs:
      - protocol: tcp
        port_range: 3306-3306
    traffic_type: default
  - name: MongoDB
    type: custom
    addresses:
      - 10.66.66.129/32
    specs:
      - protocol: tcp
        port_range: 27017-27019
    traffic_type: default
  - name: StreamingMedia
    type: apps
    apps:
      - youtube
      - netflix
      - hulu
      - amazon-video
    traffic_type: default
