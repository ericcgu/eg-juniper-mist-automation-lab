switch_templates:
  - name: Durham Switches
    networks:
      CLIENT_VLAN:
        vlan_id: "{{CLIENT_VLAN}}"
      UPLINK_VLAN_1:
        vlan_id: "{{UPLINK_VLAN_1}}"
      UPLINK_VLAN_2:
        vlan_id: "{{UPLINK_VLAN_2}}"
    port_usages:
      lab_uplink:
        mode: trunk
        port_network: default
        networks:
          - CLIENT_VLAN
          - UPLINK_VLAN_1
          - UPLINK_VLAN_2
        stp_edge: False
      wifi_hosts:
        mode: access
        port_network: UPLINK_VLAN_2
        stp_edge: True
      lab_ap:
        mode: access
        port_network: UPLINK_VLAN_1
        stp_edge: True
      desktops:
        mode: trunk
        port_network: default
        networks:
          - CLIENT_VLAN
          - UPLINK_VLAN_1
          - UPLINK_VLAN_2
        stp_edge: True
    switch_matching:
      enable: True
      rules:
        - name: ex-1
          port_config:
            ge-0/0/0:
              usage: wifi_hosts
            ge-0/0/1:
              usage: lab_ap
            ge-0/0/22:
              usage: desktops
            ge-0/0/23:
              usage: lab_uplink
          match_name[0:4]: EX-1
    extra_routes:
      0.0.0.0/0:
        via: "{{GW}}"
        discard: False
    switch_mgmt:
      root_password: "{{ROOT_PW}}"
    dns_servers:
      - 8.8.8.8
    sites:
      - Durham
wlan_templates:
  - name: Durham WLAN Template
    applies:
      org_id: f2cec983-3082-49c8-83bb-0b7e2f578e90
rf_templates:
  - name: Lab RF Template
    country_code: US
    band_5:
      disabled: False
      power: 5
    band_6:
      disabled: True
    band_24:
      disabled: True
    band_24_usage: "5"
    applies:
      - name: Durham
wlans:
  - ssid: JMA_WLAN_8e90
    enabled: True
    bands:
      - 5
    band_steer: False
    auth:
      type: psk
    dynamic_psk:
      enabled: True
      source: cloud_psks
      default_psk: juniper123
      private_wlan: True
    rateset:
      5:
        template: high-density
        min_rssi: 0
    template: Durham WLAN Template
  - ssid: JMA_Guest_8e90
    enabled: True
    bands:
      - 5
    client_limit_up_enabled: True
    client_limit_up: 512
    client_limit_down_enabled: True
    client_limit_down: 1000
    auth:
      type: psk
    dynamic_psk:
      enabled: True
      source: cloud_psks
      default_psk: juniper123
      private_wlan: True
    rateset:
      5:
        template: high-density
        min_rssi: 0
    template: Durham WLAN Template
labels:
  - name: Guest
    for_site: False
    type: match
    match: "wlan_id"
    op: in
    values:
      - JMA_GUEST_8e90
wxrules:
  - src_wxtags:
      - Guest
    enabled: True
    action: allow
    template: Durham WLAN Template
    blocked_apps:
      - bit-torrent
