---
wan_edge_templates:
  - name: Durham WAN Edge Template
    type: spoke
    sites:
      - Durham
    ip_configs:
      LAN1:
        type: static
        ip: "{{LAN_PFX}}.1"
    dns_servers:
      - 8.8.8.8
    port_config:
      ge-0/0/0:
        name: INET
        usage: wan
        ip_config:
          type: dhcp
        vpn_paths:
          SunnyvaleHub-INET.OrgOverlay:
            role: spoke
            bfd_profile: broadband
            key: 1
          CupertinoHub-INET.OrgOverlay:
            role: spoke
            bfd_profile: broadband
            key: 2
      ge-0/0/1:
        name: MPLS
        usage: wan
        ip_config:
          type: static
          ip: "{{WAN_PFX}}.2"
          netmask: /24
          gateway: "{{WAN_PFX}}.1"
        vpn_paths:
          SunnyvaleHub-MPLS.OrgOverlay:
            role: spoke
            bfd_profile: broadband
            key: 1
          CupertinoHub-MPLS.OrgOverlay:
            role: spoke
            bfd_profile: broadband
            key: 2
      ge-0/0/2:
        networks:
          - LAN1
        usage: lan
    path_preferences:
      LBO:
        strategy: ordered
        paths:
          - name: INET
            type: wan
          - name: MPLS
            type: wan
      LBO_MPLS:
        strategy: ordered
        paths:
          - name: MPLS
            type: wan
          - name: INET
            type: wan
      LAN:
        strategy: ordered
        paths:
          - type: local
            networks:
              - LAN1
      Overlay_MPLS:
        strategy: ordered
        paths:
        - name: SunnyvaleHub-MPLS.OrgOverlay
          type: vpn
        - name: CupertinoHub-MPLS.OrgOverlay
          type: vpn
        - name: SunnyvaleHub-INET.OrgOverlay
          type: vpn
        - name: CupertinoHub-INET.OrgOverlay
          type: vpn
      Overlay_INET:
        strategy: ordered
        paths:
        - name: SunnyvaleHub-INET.OrgOverlay
          type: vpn
        - name: CupertinoHub-INET.OrgOverlay
          type: vpn
        - name: SunnyvaleHub-MPLS.OrgOverlay
          type: vpn
        - name: CupertinoHub-MPLS.OrgOverlay
          type: vpn
    dhcpd_config:
      enabled: True
      LAN1:
        type: local
        ip_start: 10.99.99.10
        ip_end: 10.99.99.98
        gateway: 10.99.99.1
        dns_servers:
          - 8.8.8.8
    oob_ip_config:
      type: dhcp
      node1: {
        type: dhcp
      }
    service_policies:
      - name: Desktop-SSH
        tenants:
        - Internet
        services:
        - Desktop1_SSH
        action: allow
        path_preference: LAN
        idp:
          enabled: false
      - name: Spoke-to-Hub
        tenants:
        - LAN1
        services:
        - LAN3
        - LAN4
        action: allow
        idp:
          enabled: false
        path_preference: Overlay_MPLS
      - name: Hub-to-Spoke
        tenants:
        - LAN3
        - LAN4
        services:
        - LAN1
        action: allow
        idp:
          enabled: false
        local_routing: true
      - name: Spoke-to-Spoke-outbound
        tenants:
        - LAN1
        services:
        - LAN2
        action: allow
        idp:
          enabled: false
        path_preference: Overlay_MPLS
      - name: Spoke-to-Internet
        tenants:
        - LAN1
        services:
        - any
        action: allow
        idp:
          enabled: false
        path_preference: Overlay_INET
      - name: Spoke-to-Spoke-inbound
        tenants:
        - LAN2
        services:
        - LAN1
        action: allow
        local_routing: true
      - name: Spoke-to-Hub-Services
        tenants:
          - LAN1
        services:
          - MQTT
          - MongoDB
          - Internal_Web
          - SQL
        action: allow
        path_preference: Overlay_MPLS
        idp:
          enabled: False
      - name: Streaming-Local-INET
        tenants:
          - LAN2
        services:
          - StreamingMedia
        action: allow
        path_preference: LBO
        idp:
          enabled: False
